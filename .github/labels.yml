# Source of truth for repository labels. Synced by .github/workflows/labels.yml.
# Conventions: docs/workflow/task-tracking.md

# type
- name: 'type:feature'
  color: '1d76db'
  description: 'New user-facing capability'
- name: 'type:bug'
  color: 'd73a4a'
  description: 'Something is broken'
- name: 'type:chore'
  color: 'c5def5'
  description: 'Maintenance, refactoring, dependencies'
- name: 'type:docs'
  color: '0075ca'
  description: 'Documentation only'
- name: 'type:infra'
  color: '5319e7'
  description: 'CI/CD, Docker, servers'
- name: 'type:epic'
  color: '3e4b9e'
  description: 'Roadmap phase; parent of tasks'

# area
- name: 'area:api'
  color: 'bfd4f2'
  description: 'apps/api (NestJS)'
- name: 'area:web'
  color: 'bfd4f2'
  description: 'apps/web (Next.js)'
- name: 'area:mobile'
  color: 'bfd4f2'
  description: 'apps/mobile (Expo)'
- name: 'area:contracts'
  color: 'bfd4f2'
  description: 'packages/contracts (zod API schemas)'
- name: 'area:i18n'
  color: 'bfd4f2'
  description: 'packages/i18n and translations'
- name: 'area:infra'
  color: 'bfd4f2'
  description: 'infra/, workflows, deploy'
- name: 'area:agents'
  color: 'bfd4f2'
  description: '.claude agents, skills, docs/workflow'

# priority
- name: 'priority:P0'
  color: 'b60205'
  description: 'Critical path — do first'
- name: 'priority:P1'
  color: 'd93f0b'
  description: 'Needed to exit the phase'
- name: 'priority:P2'
  color: 'fbca04'
  description: 'Nice to have in this phase'
- name: 'priority:P3'
  color: 'fef2c0'
  description: 'Someday'

# status
- name: 'status:backlog'
  color: 'ededed'
  description: 'Captured, not refined yet'
- name: 'status:ready'
  color: '0e8a16'
  description: 'Refined; agents may pick it up'
- name: 'status:in-progress'
  color: 'fbca04'
  description: 'Claimed by /implement'
- name: 'status:in-review'
  color: 'c2e0c6'
  description: 'PR open, waiting for CI/merge'
- name: 'status:changes-requested'
  color: 'e99695'
  description: 'Reviewer found blocking issues; implementer fixes next'
- name: 'status:approved'
  color: '0e8a16'
  description: 'Reviewer approved; lands with the phase PR'
- name: 'status:blocked'
  color: 'b60205'
  description: 'Agent stopped; see last comment'
- name: 'status:needs-human'
  color: 'e99695'
  description: 'Requires the owner (secrets, accounts, decisions)'

# size
- name: 'size:S'
  color: 'c2e0c6'
  description: 'Small: one area, ~200 lines'
- name: 'size:M'
  color: 'fef2c0'
  description: 'Medium: up to ~600 lines or two areas'
- name: 'size:L'
  color: 'f9d0c4'
  description: 'Too big — must be split before work'

# phase
- name: 'phase:M0'
  color: 'd4c5f9'
  description: 'Foundation'
- name: 'phase:M1'
  color: 'd4c5f9'
  description: 'Accounts & auth'
- name: 'phase:M2'
  color: 'd4c5f9'
  description: 'Businesses, staff & services'
- name: 'phase:M3'
  color: 'd4c5f9'
  description: 'Scheduling & booking core'
- name: 'phase:M4'
  color: 'd4c5f9'
  description: 'Marketplace discovery'
- name: 'phase:M5'
  color: 'd4c5f9'
  description: 'Notifications'
- name: 'phase:M6'
  color: 'd4c5f9'
  description: 'Reviews, trust & admin'
- name: 'phase:M7'
  color: 'd4c5f9'
  description: 'Alpha launch'
