name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: najme
          POSTGRES_PASSWORD: najme
          POSTGRES_DB: najme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U najme -d najme_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Receives the emails sent by the API e2e tests (SMTP 1025, HTTP API/UI 8025).
      mailpit:
        image: axllent/mailpit:v1.31
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://najme:najme@localhost:5432/najme_test?schema=public
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAIL_FROM: Najme <no-reply@najme.test>
      APP_WEB_URL: http://localhost:3001
      MAILPIT_URL: http://localhost:8025
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: najme
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000/najme
      STORAGE_FORCE_PATH_STYLE: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Start MinIO
        run: |
          # Docker Hub minio/minio was removed (2026-09); Pigsty community image is MinIO-compatible.
          docker run -d --name najme-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -e MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:3001,http://127.0.0.1:3001 \
            pgsty/minio:RELEASE.2026-06-18T00-00-00Z server /data
          for _ in $(seq 30); do
            if curl -sf http://localhost:9000/minio/health/live; then break; fi
            sleep 1
          done
          if ! curl -sf http://localhost:9000/minio/health/live; then
            echo "MinIO did not become healthy"
            docker logs najme-minio || true
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Init MinIO bucket
        run: pnpm --filter @najme/api exec node scripts/storage-init.mjs

      - name: Format
        run: pnpm format:check

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build

      - name: Dev smoke (pnpm dev from a fresh env)
        env:
          TURBO_UI: 'false'
        run: |
          cat >.env <<EOF
          DATABASE_URL=${DATABASE_URL}
          NODE_ENV=development
          PORT=3000
          WEB_PORT=3001
          PUBLIC_URL=http://localhost:3001
          JWT_ACCESS_SECRET=ci-dev-smoke-secret-0123456789abcdef0123
          SMTP_HOST=localhost
          SMTP_PORT=1025
          MAIL_FROM="Najme <no-reply@najme.test>"
          APP_WEB_URL=http://localhost:3001
          API_INTERNAL_URL=http://localhost:3000/api/v1
          STORAGE_ENDPOINT=http://localhost:9000
          STORAGE_REGION=us-east-1
          STORAGE_BUCKET=najme
          STORAGE_ACCESS_KEY_ID=minioadmin
          STORAGE_SECRET_ACCESS_KEY=minioadmin
          STORAGE_PUBLIC_BASE_URL=http://localhost:9000/najme
          STORAGE_FORCE_PATH_STYLE=true
          EOF
          # Prove the root-.env-only path: DATABASE_URL must come from the file, not the job env.
          unset DATABASE_URL
          pnpm --filter @najme/api db:migrate:deploy
          rm -rf packages/*/dist
          setsid nohup pnpm dev >dev.log 2>&1 &
          echo $! >dev.pid
          ok=0
          for _ in $(seq 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/health || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/en || true)
            if [ "$api" = 200 ] && [ "$web" = 200 ]; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "pnpm dev did not become healthy (api=$api web=$web)"
            cat dev.log
            exit 1
          fi
          curl -s http://localhost:3000/api/v1/health
          curl -s http://localhost:3001/en | grep -q 'data-online="true"'

      - name: Stop dev processes
        if: always()
        run: |
          pkill -INT -f 'turbo' || true
          sleep 3
          if [ -f dev.pid ]; then kill -- -"$(cat dev.pid)" 2>/dev/null || true; fi
          pkill -f 'next dev' || true
          pkill -f 'dist/main.js' || true
          pkill -f 'typescript/bin/tsc' || true
          pkill -f 'turbo' || true

  # Browser e2e (#57 account flow, #88 M2 exit). Independent of the unit `ci` job so it can grow
  # services (e.g. MinIO) without coupling to format/lint. Runs every apps/web/e2e/*.spec.ts file.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: najme
          POSTGRES_PASSWORD: najme
          POSTGRES_DB: najme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U najme -d najme_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://najme:najme@localhost:5432/najme_test?schema=public
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAIL_FROM: Najme <no-reply@najme.test>
      APP_WEB_URL: http://localhost:3001
      MAILPIT_URL: http://localhost:8025
      WEB_BASE_URL: http://localhost:3001
      API_BASE_URL: http://localhost:3000/api/v1
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @najme/web exec playwright install --with-deps chromium

      - name: Start stack (pnpm dev from a fresh env)
        env:
          TURBO_UI: 'false'
        run: |
          cat >.env <<EOF
          DATABASE_URL=${DATABASE_URL}
          NODE_ENV=development
          PORT=3000
          WEB_PORT=3001
          PUBLIC_URL=http://localhost:3001
          JWT_ACCESS_SECRET=ci-e2e-secret-0123456789abcdef0123456789ab
          SMTP_HOST=localhost
          SMTP_PORT=1025
          MAIL_FROM="Najme <no-reply@najme.test>"
          APP_WEB_URL=http://localhost:3001
          API_INTERNAL_URL=http://localhost:3000/api/v1
          STORAGE_ENDPOINT=http://localhost:9000
          STORAGE_REGION=us-east-1
          STORAGE_BUCKET=najme
          STORAGE_ACCESS_KEY_ID=minioadmin
          STORAGE_SECRET_ACCESS_KEY=minioadmin
          STORAGE_PUBLIC_BASE_URL=http://localhost:9000/najme
          STORAGE_FORCE_PATH_STYLE=true
          EOF
          unset DATABASE_URL
          pnpm --filter @najme/api db:migrate:deploy
          # Generated client is gitignored — seed imports it; generate before db:seed (#88).
          pnpm --filter @najme/api db:generate
          # Demo accounts for M2 exit Playwright (#88); refused when NODE_ENV=production.
          pnpm --filter @najme/api db:seed
          rm -rf packages/*/dist
          setsid nohup pnpm dev >e2e-dev.log 2>&1 &
          echo $! >e2e-dev.pid
          ok=0
          for _ in $(seq 90); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/health || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/en || true)
            if [ "$api" = 200 ] && [ "$web" = 200 ]; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "pnpm dev did not become healthy (api=$api web=$web)"
            cat e2e-dev.log
            exit 1
          fi

      - name: Playwright e2e
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore

      - name: Stop e2e stack
        if: always()
        run: |
          pkill -INT -f 'turbo' || true
          sleep 3
          if [ -f e2e-dev.pid ]; then kill -- -"$(cat e2e-dev.pid)" 2>/dev/null || true; fi
          pkill -f 'next dev' || true
          pkill -f 'dist/main.js' || true
          pkill -f 'typescript/bin/tsc' || true
          pkill -f 'turbo' || true
          if [ -f e2e-dev.log ]; then
            echo "---- e2e-dev.log (tail) ----"
            tail -n 80 e2e-dev.log || true
          fi
