name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: najme
          POSTGRES_PASSWORD: najme
          POSTGRES_DB: najme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U najme -d najme_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://najme:najme@localhost:5432/najme_test?schema=public
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build

      - name: Dev smoke (pnpm dev from a fresh env)
        env:
          TURBO_UI: 'false'
        run: |
          pnpm --filter @najme/api db:migrate:deploy
          cat >.env <<EOF
          DATABASE_URL=${DATABASE_URL}
          NODE_ENV=development
          PORT=3000
          WEB_PORT=3001
          PUBLIC_URL=http://localhost:3001
          API_INTERNAL_URL=http://localhost:3000/api/v1
          EOF
          rm -rf packages/*/dist
          setsid nohup pnpm dev >dev.log 2>&1 &
          echo $! >dev.pid
          ok=0
          for _ in $(seq 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/health || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/en || true)
            if [ "$api" = 200 ] && [ "$web" = 200 ]; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "pnpm dev did not become healthy (api=$api web=$web)"
            cat dev.log
            exit 1
          fi
          curl -s http://localhost:3000/api/v1/health
          curl -s http://localhost:3001/en | grep -q 'data-online="true"'

      - name: Stop dev processes
        if: always()
        run: |
          if [ -f dev.pid ]; then kill -- -"$(cat dev.pid)" 2>/dev/null || true; fi
          pkill -f 'next dev' || true
          pkill -f 'dist/main.js' || true
          pkill -f 'turbo' || true
